<!--
  moltek mark: two channel faders at different levels.

  Sized for 16px, which is where a favicon actually lives. Tracks are 6 units
  wide and caps 9 units tall in a 32-unit box, so at tab size they land on 3px
  and 4.5px and stay readable. An earlier version used 3-unit tracks and three
  faders instead of two: correct picture, invisible at the only size that counts.

  Deliberately not the mascot. A favicon sits in a browser tab beside the real
  thing, which makes it the one place a derived sprite should never go.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#141413"/>
  <rect x="7"  y="3"  width="6"  height="26" fill="#3d3d3a"/>
  <rect x="19" y="3"  width="6"  height="26" fill="#3d3d3a"/>
  <rect x="4"  y="17" width="12" height="9"  fill="#d97757"/>
  <rect x="16" y="6"  width="12" height="9"  fill="#f0eee6"/>
</svg>
