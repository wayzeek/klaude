<!--
  moltek mark: a level meter, six segments rising.

  Deliberately not the mascot. A favicon sits in a browser tab beside the real
  thing, which makes it the single most recognisable place to put a derived
  sprite and the one place it should never go. A meter reads as audio, matches
  the flat tracker chrome, and is nobody's character.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#141413"/>
  <g fill="#d97757">
    <rect x="4"  y="21" width="3" height="6"/>
    <rect x="9"  y="17" width="3" height="10"/>
    <rect x="14" y="12" width="3" height="15"/>
    <rect x="19" y="15" width="3" height="12"/>
  </g>
  <rect x="24" y="8"  width="3" height="19" fill="#f0eee6"/>
  <rect x="4"  y="5"  width="23" height="2" fill="#3b3a36"/>
</svg>
